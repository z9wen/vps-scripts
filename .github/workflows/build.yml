name: Build installer

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "build.sh"
      - "Makefile"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: make syntax

      - name: Run ShellCheck
        run: make lint

      - name: Run unit tests
        run: make test

  build:
    name: Rebuild the single-file installer
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build single-file installer
        run: ./build.sh

      - name: Commit generated installer
        run: |
          if git diff --quiet -- xray-install.sh; then
            echo "Installer is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xray-install.sh
          git commit -m "chore: rebuild installer"
          git push
